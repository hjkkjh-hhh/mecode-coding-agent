// ---- 历史（带 tool_calls 配对 + 向前分页）----
function renderHistoryPage(items, prepend){
  // 工具结果按 tool_call_id 贴回它的调用下方；少了这层配对就会渲成
  // "一堆调用后面跟一堆结果"，完全看不出谁对谁。
  const results = new Map();
  for (const m of items) if (m.role === 'tool' && m.tool_call_id) results.set(m.tool_call_id, m.text);
  const frag = document.createDocumentFragment();
  for (const m of items) {
    if (m.role === 'tool') continue;                       // 已经贴到调用下方了
    if (m.role === 'user' && m.reminder) continue;         // 注入的提醒不铺进对话
    const d = document.createElement('div');
    d.className = 'msg ' + (m.role === 'user' ? 'user' : 'bot');
    if ((m.text || '').trim()) {
      const b = document.createElement('div'); b.className = 'bubble';
      if (m.role === 'user') b.textContent = m.text;    // 用户原话不渲染：他打的是什么就显示什么
      else { b._raw = m.text; paintMd(b, true); }
      d.appendChild(b);
      const acts = document.createElement('div'); acts.className = 'acts';
      acts.appendChild(copyBtn(() => m.text));          // 历史也要能复制，且拿的是原文
      d.appendChild(acts);
    }
    for (const c of m.tool_calls || []) {
      const box = toolNode(c.name, c.args);
      const sp = box.querySelector('.spin'); if (sp) sp.remove();
      box.querySelector('.tout').textContent = results.get(c.id) || '（无结果）';
      d.appendChild(box);
    }
    frag.appendChild(d);
  }
  if (prepend) col.insertBefore(frag, col.firstChild); else col.appendChild(frag);
}
let loadingMore = false;

async function loadHistory(reset){
  if (reset) { col.innerHTML = ''; histBefore = 0; toolBox.clear(); liveKind = null; pendingReasoning = []; }
  const m = $('main');
  const h0 = m.scrollHeight, t0 = m.scrollTop;     // 前插会把已有内容整体往下推
  const r = await get(`/api/history?before=${histBefore}`);
  if (r.error) return;
  histTotal = r.total; histBefore = r.next_before;
  // 轮数/工具次数/输出 token 都由服务端从 transcript 现数（见 Desk.history）。只在 reset 那次采信：
  // 翻更早的页时它是同一个全量数，但期间可能已经又跑了一轮，覆盖回去就把新的那轮抹掉了。
  if (reset) {
    turns = r.turns || 0; toolCalls = r.tool_calls || 0;
    sumOut = r.out_tokens || 0; sumThink = r.think_tokens || 0;
    renderStat();
  }
  if (r.items.length) enterChat();
  renderHistoryPage(r.items, !reset);
  refreshLoadMore();
  if (reset) return scroll();
  // 视线钉在原来那条消息上：新内容加在上面，把滚动位置往下挪同样的高度。
  // 不补偿的话每加载一页，正在看的那条就被推出视野，越翻越乱。
  m.scrollTop = t0 + (m.scrollHeight - h0);
}

/** 顶部那条"还有 N 条"。自动加载已经够用了，留着它是因为：
    历史比视口还短时根本滚不动，滚动事件永远不触发，只能靠点。 */
function refreshLoadMore(){
  const old = col.querySelector('.loadmore');
  if (old) old.remove();
  if (!histBefore) return;
  const b = document.createElement('button');
  b.className = 'btn loadmore';
  b.textContent = `↑ 加载更早（还有 ${histTotal - histBefore} 条）`;
  b.onclick = () => loadHistory(false);
  col.insertBefore(b, col.firstChild);
}

// 上滑到顶自动加载更早。
// 阈值取 140px 而不是 0：等真正贴顶才开始取，用户已经撞到底了，会有明显的一顿。
// loadingMore 这把锁不能省——滚动事件一次滑动能连发几十下，没锁就是几十个并发请求，
// 每个都拿【当时那个】histBefore，同一页会被重复插进去。
//
// 还要判【方向】。前插是【故意】不移动视线的（见 loadHistory 的补偿），所以加载完用户
// 仍停在顶部，下一个 scroll 事件立刻又满足"scrollTop <= 140"——一路把整段历史全拉完、
// 直接甩到最开头，中途页面还被几十次重排卡住。只认"这一下确实是往上滚的"，
// 一次手势加载一页；补偿写回去的是更大的 scrollTop，天然不会自触发。
let lastTop = 1e9;
$('main').addEventListener('scroll', () => {
  const top = $('main').scrollTop, up = top < lastTop;
  lastTop = top;
  if (loadingMore || !histBefore || !up || top > 140) return;
  loadingMore = true;
  loadHistory(false).finally(() => { loadingMore = false; lastTop = $('main').scrollTop; });
});

// 代码块的复制按钮。渲染出来的节点没法逐个挂 onclick，统一委托到对话列。
col.addEventListener('click', e => {
  const b = e.target.closest('.md-cp');
  if (!b) return;
  const code = b.parentElement.querySelector('code');
  if (!code || !navigator.clipboard) return;
  navigator.clipboard.writeText(code.textContent).then(() => {
    b.textContent = '已复制';
    setTimeout(() => { b.textContent = '复制'; }, 1200);
  });
});

// ---- SSE：EventSource 设不了自定义头，token 只能走查询串 ----
const es = new EventSource('/api/events?token=' + encodeURIComponent(TOKEN));
es.onmessage = e => {
  const m = JSON.parse(e.data);
  switch (m.type) {
    case 'state':          applyState(m); break;
    case 'text':           stream('text', m.text); break;
    case 'reasoning':      stream('reasoning', m.text); break;
    case 'retrying':       retrying(m); break;
    case 'tool_start':     toolStart(m); break;
    case 'tool_result':    toolResult(m); break;
    case 'notice':         notice(m.text); break;
    case 'plan':           showPlanBar(m.plan); break;
    case 'ask_permission': askPermission(m); break;
    case 'ask_user':       askUser(m); break;
    case 'dismiss':        dismiss(m.id); break;
    case 'bg':             renderBg(m.bg || []); break;
    case 'tasks':          renderTasks(m.tasks || []); break;
    case 'workflow':       renderWorkflow(m.workflow); break;
    case 'usage':
      // 每次模型响应一条。prompt 不累加——它是"这次请求带了多少上下文"，
      // 多轮之间大量重叠，加起来是个没有意义的大数（上下文占用看那个环）。
      sumOut += m.completion || 0;
      sumThink += m.reasoning || 0;
      renderStat();
      break;
    case 'bg_done':
      notice(`后台任务 #${m.id}${m.description ? '（' + m.description + '）' : ''} ${m.status}`
             + (m.exit_code != null ? `，退出码 ${m.exit_code}` : '')
             + (m.output ? '：' + m.output.slice(0, 300) : ''));
      break;
    case 'turn_start':
      pendingReasoning = [];
      // 用户消息由【发起的那个标签页】本地回显（体感更快），其余标签页照着这条渲——
      // 不然在 B 标签页看不到 A 标签页刚发的话，对话就断了。
      setBusy(true); turns++; renderStat();
      if (m.kind === 'user' && m.text) {
        if (!claimEcho(m.text)) userBubble(m.text);
      }
      break;
    case 'queued':
      // 和 turn_start 同一个约定：本地已经乐观渲过就只认领、不重复渲
      if (!claimEcho(m.text)) userBubble(m.text, true);
      break;
    case 'resumed':
      curSession = m.session; turns = 0; toolCalls = 0;
      sumOut = 0; sumThink = 0;                        // 换会话，累计量一起清
      $('planbar').hidden = true; pendingPlan = '';      // 换会话先收掉旧的待批条
      // 上下文环显式清零。applyState 里是 `s.context_tokens || ctxUsed`——那个兜底是
      // 故意的（压缩后 context_tokens 会先归零、等下次请求才测出新值，期间推 0 会让环
      // 闪一下"没有上下文"）。但换会话时新会话本来就是 0，兜底就把上一个会话的数粘住了：
      // 新会话第一条消息发出去之前显示的是旧数，模型答完才跳回真值。
      ctxUsed = 0; renderRing();
      loadHistory(true).then(() => { $('title').textContent = m.title || '新会话'; });
      get('/api/state').then(applyState);
      break;
    case 'turn_end':
      // 节流可能正压着最后一帧没画；这里无条件定稿一次，否则末尾几个字要等 66ms 才出来
      if (live && live._raw != null && liveKind === 'text') paintMd(live, true);
      liveKind = null; pendingReasoning = []; setBusy(false);
      if (m.context_tokens) ctxUsed = m.context_tokens;
      renderStat();
      break;
    case 'sessions_changed': reloadSessions(); break;   // 改名/归档：别的标签页也要跟着变
    case 'ping':           break;
  }
};
es.onerror = () => setConn('off', '连接断开');
// 断线期间发的消息，它们的 turn_start / queued 事件已经随连接一起丢了，
// 认领记号留着只会去认领【将来某条内容相同的消息】，把别的标签页发的那条吃掉不渲。
// 重连时一律清空：这一刻起的事件才有对应的本地回显。
// 连接状态不用在这里改：服务端一订阅就补发一帧 state，applyState 会把它调对。
es.onopen = () => { pendingEcho.length = 0; };

// ---- 交互 ----
const input = $('input');

/* 自动变高。【不能】走 "height=auto 再读 scrollHeight" 那一套：
   设 auto 把布局弄脏，紧接着读 scrollHeight 会逼浏览器立刻把【整页】重算一遍——
   而整页底下挂着整条对话。一次几百毫秒，粘一大段文本就是卡好几秒。
   改用离屏镜像量：镜像脱离文档流，改它不弄脏可见布局，量完一次性写回高度。 */
const mirror = document.createElement('div');
mirror.id = 'ta-mirror';
mirror.setAttribute('aria-hidden', 'true');
input.parentNode.insertBefore(mirror, input);
{
  // 字体/行高/内边距只需对齐一次：它们不随窗口变，宽度则靠 CSS 左右贴边自动跟随
  const cs = getComputedStyle(input);
  for (const k of ['fontFamily', 'fontSize', 'fontWeight', 'lineHeight',
                   'letterSpacing', 'padding', 'borderWidth', 'boxSizing'])
    mirror.style[k] = cs[k];
}
function autosize(){
  // 末尾补一个换行：文本正好以换行结尾时，最后那个空行不占高度，量出来会少一行
  mirror.textContent = input.value + '\n';
  input.style.height = Math.min(mirror.scrollHeight, 200) + 'px';
}
input.addEventListener('input', autosize);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
async function send(){
  const text = input.value.trim();
  if (!text) return;
  input.value = ''; autosize();
  // 【必须在发请求之前入队】。服务端是"先 emit 再 return"：turn_start / queued 在 HTTP
  // 响应写回【之前】就已经推到 SSE 上了。等 await 回来再记就晚了一步——
  // 抢先到达的那条事件认领不到本地回显，自己又渲一个，表现成"第一条消息发两遍"
  // （新会话最容易撞上：没有别的流量，SSE 稳稳跑赢 HTTP 响应）。
  pendingEcho.push(text);
  const node = userBubble(text);
  const r = await api('/api/send', {text});
  if (r.error) {
    claimEcho(text);                            // 没发出去，把记号撤回来
    node.remove();
    return notice(r.error);
  }
  // 排队的那条服务端会推 queued 事件；这里把已经渲好的气泡改成排队样式即可
  if (r.queued) node.classList.add('queued'); else setBusy(true);
}
$('send').onclick = send;
$('stop').onclick = () => {
  if (stopping) return;             // 再点也只是重复置同一个标志位，不会更快
  stopping = true;
  setBusy(true);                    // 立刻重画成"正在停止"，别等服务端下一拍状态
  api('/api/interrupt');
};
/** 锚定浮层：贴着 anchor 弹出。默认往上开（触发器都在底部输入框那一行），
    上方不够就翻到下面；左右夹在视口内，免得贴边时被切掉一半。 */
function popover(anchor, html, onClick, minW){
  document.querySelectorAll('.pop').forEach(x => x.remove());
  const pop = document.createElement('div');
  pop.className = 'pop'; pop.innerHTML = html;
  // minW：浮层是某个控件的下拉列表时传控件宽度，列表至少和控件一样宽（下限见 .pop 的 max()）
  if (minW) pop.style.setProperty('--anchor-w', minW + 'px');
  document.body.appendChild(pop);              // 先挂上才量得到尺寸
  const r = anchor.getBoundingClientRect();
  const gap = 8;
  const up = r.top - pop.offsetHeight - gap;
  pop.style.top = (up >= gap ? up : r.bottom + gap) + 'px';
  pop.style.left = Math.max(gap,
    Math.min(r.left, innerWidth - pop.offsetWidth - gap)) + 'px';
  const close = () => {
    pop.remove();
    document.removeEventListener('keydown', onKey, true);
    document.removeEventListener('scroll', close, true);
  };
  const onKey = e => { if (e.key === 'Escape') { e.stopPropagation(); close(); } };
  // 浮层是 fixed 定位、按打开那一刻的位置钉死的，底下的容器一滚它就飘在错的地方
  // （设置面板内容区是能滚的）。捕获阶段才收得到内部容器的滚动。
  document.addEventListener('scroll', close, true);
  pop.addEventListener('click', e => onClick(e, close));
  // 捕获阶段监听：点到别处就关。setTimeout 是为了跳过【触发这次打开的那一下点击】
  // ——不跳过的话同一个事件会立刻把刚弹出来的浮层关掉。
  setTimeout(() => document.addEventListener('click', function away(e){
    if (!pop.contains(e.target)) { close(); document.removeEventListener('click', away, true); }
  }, true), 0);
  document.addEventListener('keydown', onKey, true);
  return pop;
}

/** 模式选择。四档差别不小（尤其"完全"），循环点容易一不小心切过头，改成显式选。 */
function openModes(anchor, cur){
  popover(anchor, MODES.map(m => `
    <div class="mode-opt ${m.k === cur ? 'on' : ''}" data-m="${m.k}" tabindex="0">
      ${modeIcon(m.k)}<div><div class="mt">${m.t}</div><div class="md">${m.d}</div></div></div>`).join(''),
    async (e, close) => {
      const opt = e.target.closest('[data-m]');
      if (!opt) return;
      close();
      const r = await api('/api/mode', {mode: opt.dataset.m});
      if (r && r.mode) setModeUI(r.mode);
    });
}
function setModeUI(k){
  const m = MODES.find(x => x.k === k) || MODES[0];
  $('mode-ico').innerHTML = modeIcon(k);
  $('mode-txt').textContent = m.t;
}
$('mode').onclick = e => openModes(e.currentTarget, $('mode-txt').dataset.k || 'normal');
/** 计划待批准：非模态条压在输入框上方——先让人读完计划再批，弹模态会挡住正文。
    条上"查看计划"看全文；"批准执行"切回执行模式并起一轮。 */
let pendingPlan = '';
function showPlanBar(plan){
  pendingPlan = plan || '';
  $('planbar').hidden = false;
}
$('plan-view').onclick = () => {
  if (pendingPlan) showText('待批准的计划', pendingPlan);
  else get('/api/plan').then(r => showText('待批准的计划', r.plan || '（读不到计划文件）'));
};
$('plan-ok').onclick = async () => {
  const r = await api('/api/plan/approve', {});
  if (r.error) return notice(r.error);
  $('planbar').hidden = true; pendingPlan = '';
};

// 箭头包一层不是多余的：openSettings 定义在后加载的 settings.js 里，
// 写成 onclick = openSettings 会在绑定这一刻取到 undefined。
$('model').onclick = () => openSettings('model');     // 点模型名直接落到模型页
$('settings').onclick = () => openSettings();
$('new').onclick = async () => {
  const r = await api('/api/session/new', {});
  if (r.error) notice(r.error);
};
function toggleRail(show){
  $('rail').hidden = !show;
  $('rail-show').hidden = show;
  if (!show) $('topbar').hidden = false;      // 收起侧栏后要有地方放展开按钮
}
$('ws-add').innerHTML = IC.plus;      // HTML 里留空，图标统一由 IC 填，免得两处形状对不上
document.querySelector('.newbtn .ig').innerHTML = IC.plus;
document.querySelector('#mode .car').innerHTML = IC.chev;
$('rail-hide').onclick = () => toggleRail(false);
$('rail-show').onclick = () => toggleRail(true);

// ---- 侧栏拖宽 ----
const RAIL_MIN = 200, RAIL_MAX = 520, RAIL_DEFAULT = 276;
const setRail = px => document.documentElement.style
  .setProperty('--rail', Math.round(Math.min(RAIL_MAX, Math.max(RAIL_MIN, px))) + 'px');
try {                                        // 记住上次拖到的宽度
  const w = +localStorage.getItem('mecode-rail');
  if (w) setRail(w);
} catch (e) {}

const grip = $('grip');
// 用 pointer 事件 + setPointerCapture，不往 document 上挂 mousemove：
// 指针拖出窗口再松开时 mouseup 收不到，侧栏会一直粘着跟手走。
// 捕获之后不管指针跑到哪，事件都还回到这个元素上，pointerup 一定收得到。
grip.addEventListener('pointerdown', e => {
  e.preventDefault();
  grip.setPointerCapture(e.pointerId);
  grip.classList.add('on');
  document.body.classList.add('resizing');
});
grip.addEventListener('pointermove', e => {
  if (!grip.hasPointerCapture(e.pointerId)) return;
  setRail(e.clientX);                        // 侧栏贴左边，指针的 x 就是它该有的宽度
});
const endResize = e => {
  if (!grip.hasPointerCapture(e.pointerId)) return;
  grip.releasePointerCapture(e.pointerId);
  grip.classList.remove('on');
  document.body.classList.remove('resizing');
  try {
    localStorage.setItem('mecode-rail',
      parseInt(getComputedStyle(document.documentElement).getPropertyValue('--rail'), 10));
  } catch (err) {}
};
grip.addEventListener('pointerup', endResize);
grip.addEventListener('pointercancel', endResize);
grip.ondblclick = () => {                    // 拖乱了给个一键回默认
  setRail(RAIL_DEFAULT);
  try { localStorage.removeItem('mecode-rail'); } catch (e) {}
};

get('/api/state').then(applyState);
loadHistory(true);
input.focus();
</script>
<!-- 设置面板：经典脚本，与上面的内联脚本共享全局词法环境；顺序不能提前 -->
<script src="settings.js"></script>
